name: Vercel Prebuilt Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - canary
      - master

env:
  VERCEL: "1"
  VERCEL_ENV: "production"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_OPTIONS: "--max-old-space-size=14336"
  FTS_SEARCH_PROVIDER: pg_like
  VERCEL_ANALYZE_BUILD_OUTPUT: "1"

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 额外挂载 8GB 交换空间（凑齐 24GB 内存防爆）
        run: |
          sudo fallocate -l 8G /swapfile_extra || true
          sudo chmod 600 /swapfile_extra || true
          sudo mkswap /swapfile_extra || true
          sudo swapon /swapfile_extra || true
          free -h

      - name: 2. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 3. 配置 Node 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. 配置 Bun 环境
        uses: oven-sh/setup-bun@v2

      - name: 5. 启用 pnpm 与安装 Vercel 工具
        run: |
          corepack enable
          npm install --global vercel@latest

      - name: 6. 自动拉取你在 Vercel 填好的数据库等环境变量
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 6.5 注入 Neon 补丁与 250MB 终极瘦身钩子（含裁剪多余外语包）
        run: |
          cat << 'EOF' > .vercel-slim.mjs
          import fs from 'node:fs';
          import path from 'node:path';

          const DROP_PATTERNS = [
            'ffmpeg-static',
            'file-parse-worker',
            'sharp-libvips',
            'packages/database/migrations',
            '@larksuiteoapi',
            'pdfjs-dist',
            'discord.js',
            'dist/desktop',
            'dist/mobile',
            'public/_spa',
            'playwright',
            'electron',
            '/@opentelemetry/',
            '@opentelemetry+',
          ];

          const KEEP_LOCALES = new Set(['zh-CN', 'en-US']);

          function shouldDropRef(rawPath) {
            const norm = String(rawPath).replace(/\\/g, '/');
            const lower = norm.toLowerCase();

            // 1. 删掉所有调试映射、TS类型声明、说明文档、旧版字体
            if (
              lower.endsWith('.map') ||
              lower.endsWith('.d.ts') ||
              lower.endsWith('.d.mts') ||
              lower.endsWith('.d.cts') ||
              lower.endsWith('.md') ||
              lower.endsWith('.markdown') ||
              lower.endsWith('.ttf') ||
              lower.endsWith('.eot') ||
              lower.endsWith('.woff') ||
              lower.includes('/readme') ||
              lower.includes('/changelog') ||
              lower.includes('/license') ||
              lower.includes('/__tests__/') ||
              lower.includes('/docs/')
            ) {
              return true;
            }

            // 2. 裁剪多余外语包（只保留 zh-CN 和 en-US）
            const localeMatch = norm.match(/(?:^|\/)locales\/([^/]+)\//);
            if (localeMatch && !KEEP_LOCALES.has(localeMatch[1])) {
              return true;
            }

            // 3. 剔除重型非聊天依赖包
            return DROP_PATTERNS.some((p) => norm.includes(p));
          }

          function walk(dir, cb) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, cb);
              else cb(full);
            }
          }

          let nftFiles = 0;
          let removedRefs = 0;
          let removedMaps = 0;

          // 清洗 .next 下所有 .nft.json 清单
          walk('.next', (full) => {
            if (full.endsWith('.map')) {
              fs.unlinkSync(full);
              removedMaps++;
              return;
            }
            if (!full.endsWith('.nft.json')) return;
            try {
              const data = JSON.parse(fs.readFileSync(full, 'utf8'));
              if (!Array.isArray(data.files)) return;
              const before = data.files.length;
              data.files = data.files.filter((f) => !shouldDropRef(f));
              const diff = before - data.files.length;
              if (diff > 0) {
                fs.writeFileSync(full, JSON.stringify(data));
                nftFiles++;
                removedRefs += diff;
              }
            } catch {}
          });

          // 物理删掉多余外语包文件夹，双保险防止二次打包
          let removedLocales = 0;
          if (fs.existsSync('locales')) {
            for (const entry of fs.readdirSync('locales', { withFileTypes: true })) {
              if (entry.isDirectory() && !KEEP_LOCALES.has(entry.name)) {
                fs.rmSync(path.join('locales', entry.name), { recursive: true, force: true });
                removedLocales++;
              }
            }
          }

          // 置空巨型二进制与已跑完的建表脚本
          let truncated = 0;
          walk('node_modules/.pnpm', (full) => {
            const norm = full.replace(/\\/g, '/');
            if (
              (norm.includes('ffmpeg-static') && (norm.endsWith('/ffmpeg') || norm.endsWith('/ffprobe'))) ||
              (norm.includes('sharp-libvips') && norm.includes('.so'))
            ) {
              try {
                fs.writeFileSync(full, '');
                truncated++;
              } catch {}
            }
          });

          const workerFile = 'dist/file-parse-worker/fileParseWorker.mjs';
          if (fs.existsSync(workerFile)) {
            fs.writeFileSync(workerFile, 'export default {};\n');
            truncated++;
          }

          walk('packages/database/migrations', (full) => {
            try {
              fs.unlinkSync(full);
              truncated++;
            } catch {}
          });

          console.log(`[vercel-slim] Cleaned ${nftFiles} .nft.json (-${removedRefs} refs), removed ${removedLocales} unused locales, ${removedMaps} .map files, slimmed ${truncated} heavy files.`);
          EOF

          python3 - << 'PYEOF'
          import json, pathlib, re

          # 1. 绕过 Neon 已废弃的 pg_search 插件
          for p in pathlib.Path('.').rglob('*.sql'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              if 'pg_search' in txt:
                  new_txt = re.sub(r"name\s*=\s*'pg_search'", "name = 'pg_search_skip_neon'", txt)
                  p.write_text(new_txt, encoding='utf-8')
                  print('Patched SQL:', p)

          # 2. 将终极瘦身钩子挂载到 build:vercel 末尾
          pkg_path = pathlib.Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          cmd = pkg['scripts']['build:vercel']
          if '.vercel-slim.mjs' not in cmd:
              pkg['scripts']['build:vercel'] = cmd + ' && node .vercel-slim.mjs'
              pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('Patched build:vercel:', pkg['scripts']['build:vercel'])
          PYEOF

      - name: 7. 在 GitHub 24GB 机器上进行云端编译
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 8. 将编译好的成品直接推送到 Vercel 上线
        run: vercel deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
