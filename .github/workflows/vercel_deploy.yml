name: Vercel Prebuilt Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - canary
      - master

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_OPTIONS: "--max-old-space-size=14336"
  FTS_SEARCH_PROVIDER: pg_like
  VERCEL_ANALYZE_BUILD_OUTPUT: "1"

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 额外挂载 8GB 交换空间（凑齐 24GB 内存防爆）
        run: |
          sudo fallocate -l 8G /swapfile_extra || true
          sudo chmod 600 /swapfile_extra || true
          sudo mkswap /swapfile_extra || true
          sudo swapon /swapfile_extra || true
          free -h

      - name: 2. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 3. 配置 Node 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. 配置 Bun 环境
        uses: oven-sh/setup-bun@v2

      - name: 5. 启用 pnpm 与安装 Vercel 工具
        run: |
          corepack enable
          npm install --global vercel@latest

      - name: 6. 自动拉取你在 Vercel 填好的数据库等环境变量
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 6.5 自动绕过 Neon 已废弃的 pg_search 插件报错
        run: |
          python3 -c "
          import pathlib, re
          for p in pathlib.Path('.').rglob('*.sql'):
              txt = p.read_text(encoding='utf-8', errors='ignore')
              if 'pg_search' in txt:
                  new_txt = re.sub(r\"name\s*=\s*'pg_search'\", \"name = 'pg_search_skip_neon'\", txt)
                  p.write_text(new_txt, encoding='utf-8')
                  print('Patched:', p)
          "

      - name: 7. 在 GitHub 24GB 机器上进行云端编译
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 7.5 精简 _middleware 体积（压到 250MB 以下）并打印体积排行
        run: |
          TARGET=".vercel/output/functions/_middleware.func"
          if [ -d "$TARGET" ]; then
            echo "=== 瘦身前大小 ==="
            du -shL "$TARGET" || du -sh "$TARGET"
            echo "=== 瘦身前最大的前 25 项 ==="
            du -h --max-depth=4 "$TARGET" 2>/dev/null | sort -rh | head -n 25

            echo "=== 清理非运行时文件（.map / .d.ts / 编译器 / 桌面端产物）==="
            find "$TARGET" -type f \( -name "*.map" -o -name "*.d.ts" -o -name "*.d.mts" \) -delete
            rm -rf "$TARGET/dist/desktop" 2>/dev/null || true
            find "$TARGET" -type d \( \
              -name "@next+swc*" -o -name "swc-*" -o \
              -name "typescript" -o -name "typescript@*" -o \
              -name "@esbuild" -o -name "esbuild" -o -name "esbuild@*" -o \
              -name "playwright*" -o -name "electron*" -o \
              -name "vitest*" -o -name "eslint*" -o -name "prettier*" \
            \) -prune -exec rm -rf {} + 2>/dev/null || true

            echo "=== 瘦身后大小 ==="
            du -shL "$TARGET" || du -sh "$TARGET"
            echo "=== 瘦身后剩余最大的前 25 项 ==="
            du -h --max-depth=4 "$TARGET" 2>/dev/null | sort -rh | head -n 25
          else
            ls -la .vercel/output/functions/
          fi

      - name: 8. 将编译好的成品直接推送到 Vercel 上线
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
